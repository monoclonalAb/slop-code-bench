# Prices from platform.claude.com/docs/en/about-claude/pricing (Oct 2026).
# Same input/output prices as Fable 5, but cache reads are 0.025x input
# ($0.25) instead of 0.1x. The full 1M context is billed at these rates.
internal_name: claude-fable-5-1
provider: anthropic
pricing:
  input: 10
  output: 50
  cache_read: 0.25
  cache_write: 12.5
# Claude 5 family: adaptive thinking, steered by effort level.
thinking_style: effort
aliases:
  - claude-fable-5.1
  - claude-fable-5-1
  - fable-5.1
  - fable-5-1

agent_specific:
  claude_code:
    endpoint: anthropic

  mini_swe:
    model_name: anthropic/claude-fable-5-1
    model_class: litellm

  codex:
    thinking: high

  opencode:
    provider_name: anthropic

provider_slugs:
  bedrock: anthropic.claude-fable-5-1
  foundry: claude-fable-5-1
  # Portkey model-catalog slug: "@<integration>/<model>", where <integration>
  # is the provider integration name in your Portkey workspace.
  portkey: "@anthropic/claude-fable-5-1"
